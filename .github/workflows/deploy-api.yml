name: Deploy API

permissions:
  contents: read
  issues: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          HUSKY: 0

      - name: Run lint
        run: |
          yarn eslint ./apps/apii
          yarn workspace desktop eslint src

      - name: Run tests
        run: yarn test --coverage --runInBand

      - name: Typecheck source package
        run: yarn tsc --noEmit -p packages/source/tsconfig.json

      - name: Typecheck API
        run: yarn tsc --noEmit -p apps/apii/tsconfig.app.json

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy API through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull --ff-only
            export EXPECTED_MIGRATION=Migration20260720120000
            docker compose -f apps/apii/docker-compose.yaml --env-file apps/apii/.env build --no-cache api
            docker compose -f apps/apii/docker-compose.yaml --env-file apps/apii/.env up -d --force-recreate api
            docker compose -f apps/apii/docker-compose.yaml --env-file apps/apii/.env exec -T api \
              node node_modules/@mikro-orm/cli/cli.js migration:up \
              --config dist/apps/apii/apps/apii/src/mikro-orm.config.js
            docker image prune -f

  supervision-drill:
    name: Controlled supervision drill
    runs-on: ubuntu-latest
    needs: deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[supervision-drill]')
    steps:
      - name: Confirm healthy baseline through the monitoring channel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: curl --fail --silent --show-error --max-time 15 http://localhost:3000/health

      - name: Stop the API intentionally
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            export EXPECTED_MIGRATION=Migration20260720120000
            docker compose -f apps/apii/docker-compose.yaml --env-file apps/apii/.env stop api

      - name: Confirm the outage through the monitoring channel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if curl --fail --silent --show-error --max-time 10 http://localhost:3000/health; then
              echo "The API still answers successfully; the controlled outage was not observed."
              exit 1
            fi

      - name: Timestamp the detected outage
        run: printf '{"detected_at":"%s","probe":"GitHub Actions via SSH","url":"http://localhost:3000/health","state":"down"}\n' "$(date -u +%FT%TZ)" > supervision-drill.json

      - name: Create the external alert
        id: alert
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ALERTE SUPERVISION] API indisponible — exercice contrôlé ${context.runId}`,
              body: `La sonde GitHub Actions exécutée via le canal SSH du VPS a détecté l'indisponibilité de \`http://localhost:3000/health\`.\n\nExercice contrôlé, run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setOutput('issue_number', issue.data.number);

      - name: Restart the API
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            export EXPECTED_MIGRATION=Migration20260720120000
            docker compose -f apps/apii/docker-compose.yaml --env-file apps/apii/.env start api

      - name: Confirm recovery through the monitoring channel
        id: recovery
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 10 http://localhost:3000/health; then
                exit 0
              fi
              sleep 10
            done
            exit 1

      - name: Timestamp the recovery
        if: steps.recovery.outcome == 'success'
        run: printf '{"recovered_at":"%s","probe":"GitHub Actions via SSH","url":"http://localhost:3000/health","state":"up"}\n' "$(date -u +%FT%TZ)" > supervision-recovery.json

      - name: Record recovery and close the alert
        if: steps.alert.outputs.issue_number != '' && steps.recovery.outcome == 'success'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.alert.outputs.issue_number }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `Retour au vert confirmé par la sonde externe. API de nouveau disponible. Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Archive the supervision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervision-drill-${{ github.run_id }}
          path: supervision-*.json
          if-no-files-found: warn
