name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          HUSKY: 0

      - name: Run tests
        run: yarn test --coverage --runInBand

      - name: Typecheck source package
        run: yarn tsc --noEmit -p packages/source/tsconfig.json

      - name: Typecheck API
        run: yarn tsc --noEmit -p apps/apii/tsconfig.app.json

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy API through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull --ff-only
            docker compose -f apps/apii/docker-compose.yaml --env-file apps/apii/.env build api
            docker compose -f apps/apii/docker-compose.yaml --env-file apps/apii/.env up -d
            docker image prune -f
