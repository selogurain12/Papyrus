services:
    api:
        build:
            context: ../..
            dockerfile: apps/apii/Dockerfile
        restart: always
        environment:
            NODE_ENV: production
            APP_VERSION: ${APP_VERSION:-1.0.1}
            EXPECTED_MIGRATION: ${EXPECTED_MIGRATION:?EXPECTED_MIGRATION must identify the latest application migration}
            PORT: 3000
            DBHOST: postgres
            PGPORT: 5432
            PGDATABASE: ${PGDATABASE}
            PGUSER: ${PGUSER}
            PGPASSWORD: ${PGPASSWORD}
            JWT_SECRET: ${JWT_SECRET}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
            AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
            AWS_SECRET_KEY: ${AWS_SECRET_KEY}
            AWS_REGION: ${AWS_REGION}
            AWS_BUCKET: ${AWS_BUCKET}
            DB_SCHEMA_MODE: migrate
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            interval: 60s
            timeout: 10s
            retries: 2
            start_period: 30s

    postgres:
        image: postgres:16
        restart: always
        environment:
            POSTGRES_DB: ${PGDATABASE}
            POSTGRES_USER: ${PGUSER}
            POSTGRES_PASSWORD: ${PGPASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5

    pgadmin:
        image: dpage/pgadmin4
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        ports:
            - "5050:80"
        depends_on:
            - postgres

volumes:
    postgres-data:
